<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DestaAlcohol Newsletter</title>
  <style type="text/css">
    /* Base styles */
    body {
      margin: 0;
      padding: 0;
      min-width: 100%;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      color: #333333;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    
    /* Ensure tables don't have spacing */
    table {
      border-spacing: 0;
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    
    /* Text formatting styles that match your editor */
    h1, h2, h3, h4, h5, h6 {
      margin-top: 20px;
      margin-bottom: 10px;
      line-height: 1.2;
      color: #333333;
    }
    
    p {
      margin-top: 0;
      margin-bottom: 16px;
    }
    
    ul, ol {
      margin-top: 0;
      margin-bottom: 16px;
      padding-left: 40px;
    }
    
    blockquote {
      margin: 16px 0;
      padding: 10px 20px;
      border-left: 5px solid #eeeeee;
      color: #666666;
    }
    
    code {
      font-family: monospace;
      background-color: #f5f5f5;
      padding: 2px 4px;
      border-radius: 3px;
    }
    
    hr {
      border: 0;
      border-top: 1px solid #eeeeee;
      margin: 20px 0;
    }
    
    a {
      color: #0066cc;
      text-decoration: underline;
    }
    
    /* Responsive styles */
    @media only screen and (max-width: 600px) {
      .container {
        width: 100% !important;
      }
      
      .content {
        padding: 10px !important;
      }
      
      .header {
        padding: 10px 20px !important;
      }
      
      .footer {
        padding: 20px 10px !important;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5;">

  <!-- Email container -->
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f5f5f5;">
    <tr>
      <td style="padding: 20px 0;">
        <table role="presentation" cellpadding="0" cellspacing="0" width="600" align="center" class="container" style="background-color: #ffffff; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1);">
          
          <!-- Header section -->
          <tr>
            <td class="header" style="background-color: #4A90E2; padding: 20px 40px; text-align: center;">
              <h1 style="color: #ffffff; margin: 0; font-size: 24px; font-weight: bold;">Desta Alcohol and Liquor PLC</h1>
            </td>
          </tr>
          
          <!-- Main content -->
          <tr>
            <td class="content" style="padding: 30px 40px;">
                {{ content }}
            </td>
          </tr>
          
          <!-- Footer -->
          <tr>
            <td class="footer" style="background-color: #f5f5f5; padding: 20px 40px; text-align: center; border-top: 1px solid #eeeeee;">
              <p style="margin: 0 0 10px 0; color: #666666; font-size: 14px;">
                &copy; 2025 Desta Alcohol & Liquor. All rights reserved.
              </p>
              <p style="margin: 0; color: #666666; font-size: 14px;">
                <a href="{{UnsubscribeLink}}" style="color: #666666; text-decoration: underline;">Unsubscribe</a> | 
              </p>
              <p style="margin: 10px 0 0 0; color: #666666; font-size: 14px;">
                Ethiopia,Tigray, mekelle
              </p>
            </td>
          </tr>
          
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
